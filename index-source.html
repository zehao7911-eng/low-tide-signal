<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101727">
  <meta name="description" content="A tide-bending 3D harbor mystery. Lower the water, recover what was lost, and bring the last ferry home.">
  <title>Low Tide Signal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game" id="game">
    <header class="mast">
      <div class="brand"><i aria-hidden="true">◒</i><div><small>THE NORTH HARBOR FILES</small><h1>Low Tide Signal</h1></div></div>
      <div class="top-actions"><button id="sound" type="button" aria-label="Sound" aria-pressed="true">♫</button><button id="book" type="button" aria-label="Harbor log">▤</button></div>
    </header>
    <section class="scene" id="scene" aria-label="Interactive harbor scene">
      <canvas id="world" aria-hidden="true"></canvas>
      <div class="camera-frame" aria-hidden="true"></div>
      <div class="scene-head"><span id="district"></span><strong id="chapter"></strong></div>
      <div class="stamp" aria-hidden="true">NORTH<br><span>◬</span><br>HARBOR</div>
      <div id="points" class="points"></div>
      <div id="fx" class="fx" aria-hidden="true"></div>
      <button type="button" id="signal" class="signal" hidden>✦ <span>View result</span></button>
    </section>
    <section class="console" aria-label="Harbor controls">
      <div class="message">
        <span id="tag">FIELD NOTE</span>
        <p id="line" role="status" aria-live="polite"></p>
      </div>
      <div class="deck">
        <div class="tide-wrap">
          <div class="dial-head"><span>WATERLINE</span><i id="level-mark" aria-hidden="true">≋</i><strong id="tide-label"></strong></div>
          <div class="tides" role="group" aria-label="Set the tide">
            <button type="button" data-tide="0">Low</button><button type="button" data-tide="1">Slack</button><button type="button" data-tide="2">High</button>
          </div>
        </div>
        <button type="button" class="guide" id="guide" aria-label="Show a hint"><span aria-hidden="true">✧</span>Hint</button>
      </div>
      <div class="bottom"><span id="inventory">NO TOOLS</span><span id="progress"></span></div>
    </section>
  </main>
  <dialog id="panel" aria-labelledby="dialog-title"><div id="panel-content"></div></dialog>
  <script src="vendor/three.min.js"></script>
  <script type="module" src="app.mjs"></script>
</body>
</html>
